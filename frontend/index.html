<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peto</title>
    <meta name="description" content="Trò chuyện cùng Peto, người bạn AI lanh lợi: hỏi đáp, tìm tin mới trên web, xem ảnh, đọc PDF, Word và tạo ảnh theo mô tả." />
    <!-- Thẻ xem trước khi dán link vào Discord và các app chat khác: chúng đọc
         HTML chứ không chạy JS, nên phải nằm sẵn ở đây. "summary" là ảnh vuông
         nhỏ bên phải thẻ. Ảnh (og:image) do backend chèn lúc phục vụ trang. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Peto" />
    <meta property="og:title" content="Peto" />
    <meta property="og:description" content="Trò chuyện cùng Peto, người bạn AI lanh lợi: hỏi đáp, tìm tin mới trên web, xem ảnh, đọc PDF, Word và tạo ảnh theo mô tả." />
    <meta property="og:locale" content="vi_VN" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Gắn giao diện đã lưu trước khi React chạy để không nháy sáng khi mở trang.
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("peto-theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
        } catch (error) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
