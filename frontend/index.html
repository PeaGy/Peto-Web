<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Peto</title>
    <meta name="description" content="Trò chuyện cùng Peto, Trợ lý AI số 1 cho bạn." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Peto" />
    <meta property="og:title" content="Peto" />
    <meta property="og:description" content="Trò chuyện cùng Peto, Trợ lý AI số 1 cho bạn." />
    <meta property="og:locale" content="vi_VN" />
    <!-- Ảnh lớn (og:image) do backend chèn lúc phục vụ, trỏ tới /og.png. -->
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Gắn giao diện đã lưu trước khi React chạy để không nháy sáng khi mở trang.
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("peto-theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
        } catch (error) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
