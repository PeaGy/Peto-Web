<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Không thấy trang · Peto</title>
    <script>
      // Giống hệt đoạn trong index.html: gắn giao diện đã lưu trước khi trang vẽ
      // để không nháy sáng. Trang này đứng một mình nên phải tự lo.
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("peto-theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
        } catch (error) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      /* Cố ý không dùng styles.css: tên file bundle có hash đổi theo mỗi lần
         build, mà trang lỗi thì phải hiện được cả khi bundle hỏng.
         Màu chép từ :root của styles.css, không lấy tông poster. */
      :root {
        --bg: #141414;
        --panel: #1a1a1a;
        --line: #2b2b2b;
        --text: #ececec;
        --muted: #9b9b9b;
        --accent: #ffffff;
        --on-accent: #141414;
        --scroll-thumb: #3a3a3a;
        --scroll-thumb-hover: #525252;
        color-scheme: dark;
      }

      :root[data-theme="light"] {
        --bg: #ffffff;
        --panel: #f9f9f9;
        --line: #e3e3e3;
        --text: #0d0d0d;
        --muted: #6b6b6b;
        --accent: #0d0d0d;
        --on-accent: #ffffff;
        --scroll-thumb: #d4d4d4;
        --scroll-thumb-hover: #b0b0b0;
        color-scheme: light;
      }

      * { box-sizing: border-box; }

      html { height: 100%; }

      /* min-height chứ không phải height: màn hình thấp thì body phải giãn ra
         theo thẻ. Và căn giữa bằng `margin: auto` trên thẻ chứ không phải
         `align-items: center` — cách kia khi nội dung cao hơn khung sẽ đẩy phần
         thừa lên trên vùng cuộn, cắt mất đầu thẻ mà không kéo tới được. */
      body {
        min-height: 100%;
        margin: 0;
        display: flex;
        justify-content: center;
        padding: 32px 20px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }

      ::-webkit-scrollbar-thumb {
        border: 3px solid transparent;
        border-radius: 999px;
        background: var(--scroll-thumb);
        background-clip: content-box;
      }

      ::-webkit-scrollbar-thumb:hover {
        border-width: 2px;
        background: var(--scroll-thumb-hover);
        background-clip: content-box;
      }

      @supports not selector(::-webkit-scrollbar) {
        html {
          scrollbar-width: thin;
          scrollbar-color: var(--scroll-thumb) transparent;
        }
      }

      main {
        width: min(420px, 100%);
        margin: auto;
        text-align: center;
      }

      .code {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.14em;
      }

      h1 {
        margin: 8px 0 0;
        font-size: 28px;
        font-weight: 650;
        letter-spacing: -0.02em;
        line-height: 1.3;
        text-wrap: balance;
      }

      p { margin: 10px auto 0; max-width: 34em; color: var(--muted); }

      a {
        display: inline-block;
        margin-top: 22px;
        padding: 10px 18px;
        border-radius: 10px;
        background: var(--accent);
        color: var(--on-accent);
        font-size: 14px;
        font-weight: 650;
        text-decoration: none;
      }

      a:hover { opacity: 0.88; }

      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Không thấy trang này.</h1>
      <p>Đường dẫn có thể gõ nhầm, hoặc trang này chưa từng có ở đây.</p>
      <a href="/">Về trang chủ</a>
    </main>
  </body>
</html>
