<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Không tìm thấy trang · Peto</title>
    <script>
      // Giống hệt đoạn trong index.html: gắn giao diện đã lưu trước khi trang vẽ
      // để không nháy sáng. Trang này đứng một mình nên phải tự lo.
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("peto-theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
        } catch (error) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      /* Cố ý không dùng styles.css: tên file bundle có hash đổi theo mỗi lần
         build, mà trang lỗi thì phải hiện được cả khi bundle hỏng. */
      :root {
        --bg: #14131a;
        --panel: #1c1b24;
        --line: #2f2d3d;
        --text: #ece9f5;
        --muted: #9a94b0;
        --accent: #b58cf0;
        --on-accent: #14131a;
        --scroll-thumb: #3f3c54;
        --scroll-thumb-hover: #565273;
        color-scheme: dark;
      }

      :root[data-theme="light"] {
        --bg: #f6f4fb;
        --panel: #ffffff;
        --line: #e1dcef;
        --text: #211f2b;
        --muted: #67617d;
        --accent: #7444c9;
        --on-accent: #ffffff;
        --scroll-thumb: #cfc8e4;
        --scroll-thumb-hover: #b4a9d3;
        color-scheme: light;
      }

      * { box-sizing: border-box; }

      html { height: 100%; }

      /* min-height chứ không phải height: màn hình thấp thì body phải giãn ra
         theo thẻ. Và căn giữa bằng `margin: auto` trên thẻ chứ không phải
         `align-items: center` — cách kia khi nội dung cao hơn khung sẽ đẩy phần
         thừa lên trên vùng cuộn, cắt mất đầu thẻ mà không kéo tới được. */
      body {
        min-height: 100%;
        margin: 0;
        display: flex;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      /* Giữ giống styles.css. Chromium bỏ qua ::-webkit-scrollbar ngay khi thấy
         scrollbar-width, nên thuộc tính chuẩn phải nằm trong @supports bên dưới. */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }

      ::-webkit-scrollbar-thumb {
        border: 3px solid transparent;
        border-radius: 999px;
        background: var(--scroll-thumb);
        background-clip: content-box;
      }

      ::-webkit-scrollbar-thumb:hover {
        border-width: 2px;
        background: var(--scroll-thumb-hover);
        background-clip: content-box;
      }

      @supports not selector(::-webkit-scrollbar) {
        html {
          scrollbar-width: thin;
          scrollbar-color: var(--scroll-thumb) transparent;
        }
      }

      main {
        width: 100%;
        max-width: 420px;
        margin: auto;
        padding: 40px 32px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        text-align: center;
      }

      .mark { display: block; margin: 0 auto 18px; color: var(--muted); }

      .code {
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 { margin: 10px 0 0; font-size: 25px; line-height: 1.35; }

      p { margin: 12px 0 0; color: var(--muted); }

      a {
        display: inline-block;
        margin-top: 26px;
        padding: 11px 22px;
        border-radius: 10px;
        background: var(--accent);
        color: var(--on-accent);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }

      a:hover { opacity: 0.9; }

      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <!-- Kính lúp soi vào chỗ trống. Ngôi sao lấp lánh là dấu hiệu "tạo ảnh"
           của app, dùng ở trang lỗi sẽ đọc nhầm thành có gì đó vui. -->
      <svg class="mark" width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.75" stroke="currentColor" stroke-width="1.5" />
        <path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
      <span class="code">Lỗi 404</span>
      <h1>Ở đây không có gì cả.</h1>
      <p>Peto tìm quanh rồi mà không thấy trang bạn cần. Có thể đường dẫn bị gõ nhầm, hoặc nó chưa từng tồn tại.</p>
      <a href="/">Về trang chủ</a>
    </main>
  </body>
</html>
