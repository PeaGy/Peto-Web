name: Kiểm tra frontend
on:
  push:
    paths: ['frontend/**', '.github/workflows/frontend-checks.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-checks.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cài thư viện
        run: npm ci
      - name: Cài trình duyệt kiểm thử
        run: npx playwright install chromium
      - name: Kiểm tra logic
        run: npm test
      - name: Build giao diện
        run: npm run build
      - name: Kiểm tra PC và mobile
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        # Giữ cả báo cáo flaky khi lần thử lại đã qua, để lỗi tạm thời vẫn có dấu vết.
        if: always()
        with:
          name: ket-qua-frontend
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
