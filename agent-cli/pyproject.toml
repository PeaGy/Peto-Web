[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peto"
version = "0.33.3"
description = "Peto Agent: nhờ Peto sửa code ngay trong thư mục dự án trên máy bạn."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = []

[project.scripts]
peto = "peto_agent.__main__:main"

[tool.setuptools]
packages = ["peto_agent", "peto_agent.tui", "peto_agent.providers", "peto_agent.bundle"]

[tool.setuptools.package-data]
peto_agent = ["command_catalog.json"]
